# Checks every pull request, and deploys main to production (https://vab.<account>.workers.dev)
# when it changes: the Worker with its Room Durable Object, and the static site (Bevy client,
# GGRS module, emulator frontend). Cores, ROMs and start-up states live in R2 and are uploaded
# by hand (README, Deploy).
#
# Jobs run side by side and keep their compiled crates between runs; pull requests start from
# main's. Pull requests lint (which compiles every crate) and build the Worker; main also builds
# the site the slow, small way players download it (fat LTO, wasm-opt -Oz), then deploys.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN (a token from the "Edit Cloudflare Workers"
# template) and CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  pull_request:
    paths-ignore: ["art/**", "tools/art/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["art/**", "tools/art/**", "**.md"]

# Deploys run one at a time, in order; a new push to a pull request replaces its running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --target wasm32-unknown-unknown --component clippy,rustfmt
          rustup default "$channel"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The editor (tools/editor) is a desktop app and isn't part of the site.
      - name: Lint
        run: cargo clippy -p client -p netplay -p server -p world --target wasm32-unknown-unknown -- -D warnings

  # Pull requests: the Worker compiles (deploy below does this on main).
  worker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
          rustup default "$channel"
      # Shared with deploy. Also keeps worker-build, which wrangler would otherwise compile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        working-directory: server

  site:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
          rustup default "$channel"
      - uses: Swatinem/rust-cache@v2

      # The Makefile would install wasm-bindgen from source and wasm-opt with emsdk; prebuilt
      # binaries are much faster here. wasm-bindgen must match the crate in Cargo.lock.
      - name: wasm-bindgen version
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "WASM_BINDGEN_VERSION=$version" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: wasm-opt (Binaryen)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-version_133/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: Build the site
        run: make client netplay WASM_BINDGEN="$(command -v wasm-bindgen)" WASM_OPT="$WASM_OPT"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            web/pkg
            web/netplay
            web/assets
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as pinned in rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
          rustup default "$channel"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: web
      - name: Deploy to production
        run: npx wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
