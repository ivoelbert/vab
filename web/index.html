<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade Bar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <script type="module">
      // wasm-bindgen output of the `client` crate (make client): the bar, the players and the
      // cabinets. Bevy reports where the player walks and starts and stops games through the
      // window functions below; the page tells it about the room and the game.
      import init, { cabinet_seats, game_status, player_left, player_moved, players_reset, push_frame } from "./pkg/client.js";
      import { Room } from "./room.js";

      // Browsers only allow sound after a user gesture: it starts on the first key or click.
      const audio = new AudioContext({ sampleRate: 48000 });
      await audio.audioWorklet.addModule("./emulator/audio.js");
      const speaker = new AudioWorkletNode(audio, "emulator-audio", { outputChannelCount: [2] });
      speaker.connect(audio.destination);
      for (const event of ["keydown", "pointerdown"]) {
        addEventListener(event, () => audio.resume(), { capture: true, once: true });
      }

      // The bar room this page is in (server/src/lib.rs): ?room=<name> for a private one.
      let room;
      let firstMove;
      window.roomMove = (x, y, flip) => (room ? room.move(x, y, flip) : (firstMove = [x, y, flip]));

      /**
       * The game at the cabinet this player sits at, alone or online with the others seated
       * there. When the players change, the lowest seat among those playing captures the game
       * and hands it to everyone, and all go on from there together (web/emulator/worker.js).
       */
      class Play {
        seat;
        #game;
        #worker;
        #packets;
        #mask = 0;
        #status = "";
        /** Our machine runs the game (not waiting to be handed one). */
        #playing = false;
        /** Who plays the game our machine runs, seat -> player id, and its last handover. */
        #players = new Map();
        #epoch = 0;
        /** Seat -> player id as the room has it. */
        #seated = new Map();
        #links = new Map();
        /** A handover for us, its message and its game arriving separately: epoch -> parts. */
        #handovers = new Map();
        #settle;
        #joinTimeout;

        constructor(game) {
          this.#game = game;
          this.cabinet = game.cabinet;
        }

        /** Who sits at our cabinet changed. */
        seated(players) {
          this.#seated = new Map(players.flatMap((id, seat) => (id === null ? [] : [[seat, id]])));
          const seat = players.indexOf(room.id);
          if (seat < 0) return; // not seated (yet)
          if (!this.#worker) return this.#start(seat);
          if (!this.#playing && this.#seated.size === 1) {
            // Everyone left before handing us their game: start it ourselves.
            this.#worker.postMessage({ type: "solo" });
            this.#nowPlaying(new Map([[seat, room.id]]));
            return;
          }
          // People often sit down together: wait a moment and hand over once.
          clearTimeout(this.#settle);
          this.#settle = setTimeout(() => this.#handOver(), 300);
        }

        input(mask) {
          this.#mask = mask;
          this.#worker?.postMessage({ type: "input", mask });
        }

        stop() {
          this.#worker?.terminate();
          clearTimeout(this.#settle);
          clearTimeout(this.#joinTimeout);
          for (const link of this.#links.values()) room.unlink(link);
        }

        /** Another player at our cabinet handed us a game: its players (and its bytes, below). */
        message(from, { cabinet, epoch, players }) {
          if (cabinet !== this.cabinet) return;
          this.#handovers.set(epoch, { ...this.#handovers.get(epoch), players: new Map(players) });
          this.#join(epoch);
        }

        handover(from, epoch, bytes) {
          this.#handovers.set(epoch, { ...this.#handovers.get(epoch), bytes });
          this.#join(epoch);
        }

        #start(seat) {
          this.seat = seat;
          const worker = (this.#worker = new Worker("./emulator/worker.js", { type: "module" }));
          worker.onmessage = ({ data }) => {
            if (data.type === "frame") push_frame(data.rgba, data.width, data.height);
            if (data.type === "captured") this.#captured(data);
            if (data.type === "netplay") this.#netplay(data);
          };
          const sound = new MessageChannel();
          speaker.port.postMessage(sound.port1, [sound.port1]);
          worker.postMessage({ type: "audio", port: sound.port2 }, [sound.port2]);
          // Game packets between our worker and the other players' ([seat, packet]).
          const packets = (this.#packets = new MessageChannel());
          packets.port1.onmessage = ({ data: [seat, packet] }) =>
            this.#links.get(this.#players.get(seat))?.send(packet);

          // Cores, ROM sets, BIOS sets and start-up states (emulator/snapshot.mjs) come from R2.
          // Alone we start the game; otherwise the others hand theirs over.
          const { core, rom, bios, turns } = this.#game;
          const alone = this.#seated.size === 1;
          const start = {
            type: "start",
            core: `/fbneo/${core}/fbneo.mjs`,
            rom: `/roms/${rom}.zip`,
            files: bios ? [`/roms/${bios}.zip`] : [],
            state: `/roms/${rom}.state`,
            seat,
            turns,
            port: packets.port2,
            hold: !alone,
          };
          worker.postMessage(start, [packets.port2]);
          worker.postMessage({ type: "input", mask: this.#mask });
          if (alone) {
            this.#nowPlaying(new Map([[seat, room.id]]));
          } else {
            this.#show(`Player ${seat + 1}. Joining the game...`);
            this.#joinTimeout = setTimeout(
              () => this.#playing || this.#show("Couldn't join the game. Esc and try again."),
              20000,
            );
          }
        }

        /** If we're the lowest seat still playing, hands the game to everyone seated now. */
        #handOver() {
          if (!this.#playing) return;
          const same =
            this.#seated.size === this.#players.size &&
            [...this.#seated].every(([seat, id]) => this.#players.get(seat) === id);
          if (same) return;
          const stayed = [...this.#players].filter(([seat, id]) => this.#seated.get(seat) === id);
          if (Math.min(...stayed.map(([seat]) => seat)) !== this.seat) return;
          if (this.#seated.size === 1) {
            this.#worker.postMessage({ type: "solo" });
            this.#nowPlaying(new Map(this.#seated));
            return;
          }
          const joined = [...this.#seated.keys()].filter((seat) => !this.#players.has(seat));
          this.#show(joined.length ? `Player ${joined[0] + 1} is joining...` : "Someone left, going on without them...");
          this.#players = new Map(this.#seated);
          this.#epoch++;
          this.#worker.postMessage({ type: "capture", epoch: this.#epoch });
        }

        /** Our worker captured the game: hand it to the others, and go on with them. */
        #captured({ epoch, state }) {
          if (epoch !== this.#epoch) return;
          const players = [...this.#players].sort(([a], [b]) => a - b);
          for (const [seat, id] of players) {
            if (id === room.id) continue;
            room.message(id, { cabinet: this.cabinet, epoch, players });
            room.handOver(id, epoch, state);
          }
          this.#goOnline(epoch);
        }

        /** Joins a handed-over game once both its message and its bytes are here. */
        #join(epoch) {
          const { players, bytes } = this.#handovers.get(epoch);
          if (!players || !bytes || epoch <= this.#epoch || players.get(this.seat) !== room.id) return;
          for (const older of this.#handovers.keys()) if (older <= epoch) this.#handovers.delete(older);
          this.#epoch = epoch;
          this.#players = players;
          this.#goOnline(epoch, bytes);
        }

        #goOnline(epoch, state) {
          this.#linkPlayers();
          const seats = [...this.#players.keys()].sort((a, b) => a - b);
          this.#worker.postMessage({ type: "online", epoch, seats, state }, state ? [state.buffer] : []);
          this.#playing = true;
          this.#show(`Player ${this.seat + 1}. Connecting to ${this.#others()}...`);
        }

        #nowPlaying(players) {
          this.#playing = true;
          this.#players = players;
          this.#linkPlayers();
          const seats = this.#game.players;
          this.#show(`Player ${this.seat + 1}.${seats > 1 ? " Anyone who sits at this cabinet joins you." : ""}`);
        }

        /** A link to each other player: the lower seat offers WebRTC. */
        #linkPlayers() {
          const others = new Map([...this.#players].filter(([, id]) => id !== room.id));
          for (const [id, link] of this.#links) {
            if ([...others.values()].includes(id)) continue;
            room.unlink(link);
            this.#links.delete(id);
          }
          for (const [seat, id] of others) {
            if (this.#links.has(id)) continue;
            const link = room.link(id, this.seat < seat, `${this.cabinet}/${Math.min(id, room.id)}/${Math.max(id, room.id)}`);
            link.onpacket = (packet) => {
              const from = [...this.#players].find(([, player]) => player === id)?.[0];
              if (from !== undefined) this.#packets.port1.postMessage([from, packet], [packet]);
            };
            this.#links.set(id, link);
          }
        }

        #others() {
          const seats = [...this.#players.keys()].filter((seat) => seat !== this.seat).map((seat) => seat + 1);
          return seats.length === 1 ? `player ${seats[0]}` : `players ${seats.slice(0, -1).join(", ")} and ${seats.at(-1)}`;
        }

        #netplay({ event, seat, ping, frame }) {
          const me = `Player ${this.seat + 1}`;
          if (event === "synchronized" || event === "resumed") this.#show(`${me}, online with ${this.#others()}`);
          if (event === "interrupted") this.#show(`${me}. Waiting for player ${seat + 1}'s connection...`);
          if (event === "desync") this.#show(`${me}. Out of step with the others since frame ${frame}.`);
          if (event === "stats" && !this.#status.includes("Out of step") && !this.#status.includes("Waiting")) {
            const direct = [...this.#links.values()].every((link) => link.direct);
            this.#show(`${me}, online with ${this.#others()}, ${ping ?? "?"} ms, ${direct ? "direct" : "through the server"}`);
          }
        }

        #show(text) {
          this.#status = text;
          game_status(text);
        }
      }

      let play;
      window.emulatorPlay = (core, rom, bios, cabinet, turns, players) => {
        play?.stop();
        play = new Play({ core, rom, bios, turns, players, cabinet });
        game_status("Taking a seat...");
        room.sit(cabinet, players);
      };
      window.emulatorStop = () => {
        play?.stop();
        play = undefined;
        room.stand();
      };
      window.emulatorInput = (mask) => play?.input(mask);

      await init().catch((error) => {
        // winit ends its web event loop by throwing this on purpose.
        if (!error.message.startsWith("Using exceptions for control flow")) {
          throw error;
        }
      });

      const name = new URLSearchParams(location.search).get("room") ?? "main";
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      room = new Room(`${scheme}://${location.host}/ws/${encodeURIComponent(name)}`, {
        welcome: players_reset,
        moved: player_moved,
        left: player_left,
        seats(cabinet, players) {
          cabinet_seats(cabinet, players.filter((id) => id !== null).length);
          if (play?.cabinet === cabinet) play.seated(players);
        },
        full(cabinet) {
          if (play?.cabinet === cabinet) game_status("All seats are taken. Esc to go back.");
        },
        message: (from, data) => play?.message(from, data),
        handover: (from, epoch, bytes) => play?.handover(from, epoch, bytes),
      });
      if (firstMove) room.move(...firstMove);
      document.getElementById("bevy").focus();
    </script>
  </body>
</html>
