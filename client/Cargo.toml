[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
# Only the features the bar needs, instead of the "2d"/"ui" profiles, to keep the wasm small.
# Add features back as they are needed:
# https://github.com/bevyengine/bevy/blob/v0.19.1/docs/cargo_features.md
bevy = { version = "0.19.1", default-features = false, features = [
  # App core
  "std", "async_executor", "bevy_asset", "bevy_log", "bevy_state",
  # Browser window, keyboard/mouse and gamepads
  "web", "webgl2", "bevy_winit", "bevy_window", "bevy_gilrs",
  # 2D rendering: sprites, PNG art, text, UI
  "bevy_render", "bevy_core_pipeline", "bevy_camera", "bevy_color", "bevy_image", "png",
  "bevy_mesh", "bevy_shader", "bevy_material", "bevy_sprite", "bevy_sprite_render",
  "bevy_text", "default_font", "bevy_ui", "bevy_ui_render",
] }
# Compile out log calls below `warn` in release builds (see bevy_log's LogPlugin docs).
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }
# Frames in and inputs out between Bevy and the emulator worker (src/emulator.rs).
wasm-bindgen = "0.2"
# The bar map and how to draw it (shared with tools/editor).
world = { path = "../world" }
